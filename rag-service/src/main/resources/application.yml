server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: gota-rag-service
  datasource:
    url: ${RAG_DATABASE_URL:jdbc:postgresql://localhost:5433/gota_rag}
    username: ${RAG_DATABASE_USERNAME:gota_rag}
    password: ${RAG_DATABASE_PASSWORD:}
  flyway:
    enabled: ${RAG_FLYWAY_ENABLED:true}
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:3000}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.8-flash}

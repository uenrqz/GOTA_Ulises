server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: gota-rag-service
  datasource:
    url: ${RAG_DATABASE_URL:jdbc:postgresql://localhost:5433/gota_rag}
    username: ${RAG_DATABASE_USERNAME:gota_rag}
    password: ${RAG_DATABASE_PASSWORD:}
  flyway:
    enabled: ${RAG_FLYWAY_ENABLED:true}
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:8080,http://localhost:3000}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3.2}
    embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
